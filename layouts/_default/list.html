{{ define "main" }}
    <header class="major">
        <h2>{{ .Title }}</h2>
        {{ with .Description -}}
            <p>{{ . }}</p>
        {{- end }}
    </header>

    {{- if .Params.image }}
        <span class="image featured"><img src="{{ .Params.image | relURL }}" alt="{{ .Params.image_alt }}" /></span>
    {{ end }}

    <div class="uutiset-grid">
        {{ range .RegularPages }}
            {{ .Render "shortblock" }}
        {{ end }}
    </div>
{{ end }}
